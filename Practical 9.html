<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-md">

        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">
            Personal To-Do List
        </h1>

        <p class="text-gray-500 text-center mb-6">
            Organize your daily tasks
        </p>

        <div class="flex gap-2 mb-4">
            <input type="text" id="taskInput"
                placeholder="Enter your task"
                class="flex-1 border border-gray-300 rounded-lg p-2 outline-none focus:ring-2 focus:ring-blue-400">

            <button onclick="addTask()"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                Add
            </button>
        </div>

        <ul id="taskList" class="space-y-3"></ul>

        <p id="message" class="text-center text-red-500 mt-3"></p>

    </div>

    <script>
        function addTask() {
            let input = document.getElementById("taskInput");
            let task = input.value.trim();
            let message = document.getElementById("message");

            if (task === "") {
                message.textContent = "Please enter a task!";
                return;
            }

            message.textContent = "";

            let li = document.createElement("li");
            li.className = "flex items-center justify-between bg-gray-50 p-3 rounded-lg border";

            let leftDiv = document.createElement("div");
            leftDiv.className = "flex items-center gap-2";

            let checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "w-4 h-4 accent-blue-600";

            let span = document.createElement("span");
            span.textContent = task;
            span.className = "text-gray-700 break-all";

            checkbox.addEventListener("change", function () {
                span.classList.toggle("line-through", checkbox.checked);
                span.classList.toggle("text-gray-400", checkbox.checked);
            });

            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.className = "bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 ml-2";

            deleteBtn.addEventListener("click", function () {
                li.remove();
            });

            leftDiv.appendChild(checkbox);
            leftDiv.appendChild(span);

            li.appendChild(leftDiv);
            li.appendChild(deleteBtn);

            document.getElementById("taskList").appendChild(li);

            input.value = "";
            input.focus();
        }
    </script>

</body>
</html>
